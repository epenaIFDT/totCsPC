<script>
    let rawDecryptedContent = "";
    let isJsonFormat = false;
    let parsedRows = [];
    let filteredRows = [];
    let headers = [];
    let currentPage = 1;
    const rowsPerPage = 50;

    function handleUrlChange() {
        const sel = document.getElementById("urlSelect").value;
        const customUrl = document.getElementById("customUrl");
        const fileCont = document.getElementById("fileInputContainer");
        if (sel === "custom") {
            customUrl.style.display = "block";
            fileCont.style.display = "block";
        } else {
            customUrl.style.display = "none";
            fileCont.style.display = "none";
        }
    }

    function toggleKeyVisibility() {
        const input = document.getElementById("secretKey");
        const btn = document.getElementById("toggleKeyBtn");
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "Ocultar";
        } else {
            input.type = "password";
            btn.textContent = "Mostrar";
        }
    }

    function setStatus(msg, type) {
        const el = document.getElementById("statusMsg");
        el.className = "status-badge status-" + type;
        el.innerHTML = msg;
        el.style.display = "block";
    }

    function switchView(mode) {
        const tableArea = document.getElementById("tableViewArea");
        const jsonArea = document.getElementById("jsonViewArea");
        const btnTable = document.getElementById("btnViewTable");
        const btnJson = document.getElementById("btnViewJson");
        const searchBox = document.getElementById("tableSearch");

        if (mode === "table") {
            tableArea.style.display = "block";
            jsonArea.style.display = "none";
            btnTable.classList.add("active");
            btnJson.classList.remove("active");
            searchBox.style.display = "block";
        } else {
            tableArea.style.display = "none";
            jsonArea.style.display = "block";
            btnJson.classList.add("active");
            btnTable.classList.remove("active");
            searchBox.style.display = "none";
        }
    }

    function base64UrlToBytes(base64UrlStr) {
        let base64 = base64UrlStr.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) {
            base64 += '=';
        }
        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
        }
        return bytes;
    }

    async function decryptFernetToken(tokenStr, keyBase64Url) {
        const rawKey = base64UrlToBytes(keyBase64Url);
        if (rawKey.length !== 32) {
            throw new Error(`La clave debe tener 32 bytes decodificada (longitud recibida: ${rawKey.length}).`);
        }
        const encKeyBytes = rawKey.slice(16, 32); // AES-128 key for Fernet

        const tokenBytes = base64UrlToBytes(tokenStr.trim());
        if (tokenBytes.length < 57) {
            throw new Error("El token cifrado es demasiado corto o corrupto.");
        }

        const version = tokenBytes[0];
        if (version !== 0x80) {
            throw new Error(`Versión Fernet no reconocida: ${version}`);
        }

        const iv = tokenBytes.slice(9, 25);
        const ciphertext = tokenBytes.slice(25, tokenBytes.length - 32);

        const cryptoKey = await window.crypto.subtle.importKey(
            "raw",
            encKeyBytes,
            { name: "AES-CBC" },
            false,
            ["decrypt"]
        );

        const decryptedBuffer = await window.crypto.subtle.decrypt(
            { name: "AES-CBC", iv: iv },
            cryptoKey,
            ciphertext
        );

        const decoder = new TextDecoder("utf-8");
        return decoder.decode(decryptedBuffer);
    }

    function parseCSV(text) {
        const lines = text.trim().split(/\r\n|\n/);
        if (lines.length === 0) return { headers: [], rows: [] };
        
        function splitLine(line) {
            const result = [];
            let cur = "";
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const c = line[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    result.push(cur.trim());
                    cur = "";
                } else {
                    cur += c;
                }
            }
            result.push(cur.trim());
            return result.map(v => v.replace(/^"|"$/g, '').trim());
        }

        const head = splitLine(lines[0]);
        const body = [];
        for (let i = 1; i < lines.length; i++) {
            if (lines[i].trim()) {
                body.push(splitLine(lines[i]));
            }
        }
        return { headers: head, rows: body };
    }

    function parseJsonCatalog(jsonData) {
        const rows = [];
        const head = ["ID_Caracteristica", "Nombre_Caracteristica", "ID_Valor", "Nombre_Valor"];

        if (Array.isArray(jsonData)) {
            for (const item of jsonData) {
                const idCar = item.id_caracteristica || item.ID_Caracteristica || "";
                const nomCar = item.nombre_caracteristica || item.Nombre_Caracteristica || "";
                const valores = item.valores || item.Valores || [];
                if (Array.isArray(valores) && valores.length > 0) {
                    for (const val of valores) {
                        const idVal = val.id_valor || val.ID_Valor || "";
                        const nomVal = val.nombre_valor || val.Nombre_Valor || "";
                        rows.push([idCar, nomCar, idVal, nomVal]);
                    }
                } else {
                    rows.push([idCar, nomCar, "", ""]);
                }
            }
        }
        return { headers: head, rows: rows };
    }

    async function desencriptarYMostrar() {
        const key = document.getElementById("secretKey").value.trim();
        if (!key) {
            setStatus("⚠️ Por favor ingresa la clave secreta de desencriptación.", "error");
            return;
        }

        let tokenText = "";
        const urlSelect = document.getElementById("urlSelect").value;
        const fileInput = document.getElementById("localFileInput");

        try {
            setStatus("⏳ Descargando archivo cifrado...", "loading");

            if (urlSelect === "custom" && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                tokenText = await file.text();
            } else {
                let targetUrl = urlSelect === "custom" ? document.getElementById("customUrl").value.trim() : urlSelect;
                if (!targetUrl) {
                    setStatus("⚠️ Por favor ingresa una URL válida o selecciona un archivo.", "error");
                    return;
                }
                const res = await fetch(targetUrl);
                if (!res.ok) {
                    throw new Error(`Error HTTP ${res.status} al descargar de GitHub.`);
                }
                tokenText = await res.text();
            }

            setStatus("🔐 Desencriptando archivo con Web Crypto API (AES-256/Fernet)...", "loading");
            const decryptedText = await decryptFernetToken(tokenText, key);
            rawDecryptedContent = decryptedText;

            const trimmed = decryptedText.trim();
            isJsonFormat = trimmed.startsWith("[") || trimmed.startsWith("{");

            if (isJsonFormat) {
                const jsonData = JSON.parse(trimmed);
                const parsed = parseJsonCatalog(jsonData);
                headers = parsed.headers;
                parsedRows = parsed.rows;
                document.getElementById("jsonPre").textContent = JSON.stringify(jsonData, null, 2);
                document.getElementById("btnViewJson").style.display = "inline-flex";
            } else {
                const parsed = parseCSV(trimmed);
                headers = parsed.headers;
                parsedRows = parsed.rows;
                document.getElementById("btnViewJson").style.display = "none";
            }

            switchView("table");
            filteredRows = [...parsedRows];
            currentPage = 1;
            renderTable();

            setStatus(`✅ ¡Desencriptación exitosa! (${isJsonFormat ? 'JSON' : 'CSV'} procesado correctamente con ${filteredRows.length} registros)`, "success");

            document.getElementById("resultsCard").style.display = "block";
            document.getElementById("btnDescargar").style.display = "inline-flex";
            document.getElementById("btnDescargar").textContent = isJsonFormat ? "💾 Descargar JSON Desencriptado" : "💾 Descargar CSV Desencriptado";
            document.getElementById("rowCountBadge").textContent = `${filteredRows.length} registros`;

        } catch (err) {
            console.error(err);
            setStatus(`❌ Error: ${err.message}. Verifica que la clave ingresada sea la correcta.`, "error");
        }
    }

    function renderTable() {
        const thead = document.getElementById("tableHead");
        const tbody = document.getElementById("tableBody");

        thead.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageItems = filteredRows.slice(start, end);

        if (pageItems.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center; padding: 20px;">No se encontraron registros.</td></tr>`;
        } else {
            tbody.innerHTML = pageItems.map(row => {
                return "<tr>" + row.map(cell => `<td>${cell}</td>`).join("") + "</tr>";
            }).join("");
        }

        const totalPages = Math.max(1, Math.ceil(filteredRows.length / rowsPerPage));
        document.getElementById("pageInfo").textContent = `Página ${currentPage} de ${totalPages} (Mostrando ${start + 1}-${Math.min(end, filteredRows.length)} de ${filteredRows.length})`;
        document.getElementById("prevBtn").disabled = currentPage === 1;
        document.getElementById("nextBtn").disabled = currentPage >= totalPages;
    }

    function cambiarPagina(delta) {
        const totalPages = Math.ceil(filteredRows.length / rowsPerPage);
        currentPage = Math.min(Math.max(1, currentPage + delta), totalPages);
        renderTable();
    }

    function filtrarTabla() {
        const query = document.getElementById("tableSearch").value.toLowerCase();
        if (!query) {
            filteredRows = [...parsedRows];
        } else {
            filteredRows = parsedRows.filter(row => row.some(cell => String(cell).toLowerCase().includes(query)));
        }
        currentPage = 1;
        document.getElementById("rowCountBadge").textContent = `${filteredRows.length} registros encontrados`;
        renderTable();
    }

    function descargarArchivoDesencriptado() {
        if (!rawDecryptedContent) return;
        const mimeType = isJsonFormat ? "application/json;charset=utf-8;" : "text/csv;charset=utf-8;";
        const filename = isJsonFormat ? "catalogo_desencriptado.json" : "catalogo_desencriptado.csv";
        const blob = new Blob([rawDecryptedContent], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
